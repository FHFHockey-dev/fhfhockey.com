  async function rasterizeCardSvg(svg, assertCurrent, width, height) {
    assertCurrent();
    if (width !== 1200 || ![1020, 1200].includes(height)) throw new Error("Unsupported card dimensions");
    const copy = svg.cloneNode(true);
    copy.setAttribute("width", String(width));
    copy.setAttribute("height", String(height));
    copy.removeAttribute("class");
    copy.removeAttribute("style");
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)], { type: "image/svg+xml" }));
    const backing = { canvas: null };
    try {
      return await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("PNG creation timed out. Please retry.")), 1e4);
        const image = new Image();
        image.onerror = () => {
          clearTimeout(timer);
          reject(new Error("PNG artwork could not be decoded."));
        };
        image.onload = () => {
          try {
            assertCurrent();
            const canvas = document.createElement("canvas");
            backing.canvas = canvas;
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext("2d");
            if (!context) throw new Error("Canvas is unavailable.");
            context.drawImage(image, 0, 0);
            canvas.toBlob((blob) => {
              clearTimeout(timer);
              try {
                assertCurrent();
                if (!blob) throw new Error("PNG export failed.");
                resolve(blob);
              } catch (error) {
