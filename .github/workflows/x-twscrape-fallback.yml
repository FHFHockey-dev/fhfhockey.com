# Layer 3 of the X intake safety net, in SHADOW mode (TJ, 2026-11-07): twscrape with the burner account reads the 7
# tracked X accounts every 15 minutes and posts what it reads to the x-timeline-ingest edge function, which writes only
# x_timeline_twscrape_observations. Nothing production reads changes. tools/x-twscrape-fallback/README.md has the rest.
# This repository is public, so this file and its logs are public: the job prints counts, X post ids and error class
# names only. Schedules run only from the default branch and GitHub may delay or drop them: a continuity layer.
# OFF until TJ turns it on: the job is skipped (no X request, nothing posted) unless the repository variable
# X_TWSCRAPE_SHADOW_ENABLED is "true" (Settings → Secrets and variables → Actions → Variables). Set it only after
# x-timeline-ingest is deployed with the shadow-only observe mode and verified. Delete the variable to stop the job.
name: X twscrape fallback (shadow)

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # Off the hour and the quarter hours, when GitHub's scheduler is busiest.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x-twscrape-fallback
  cancel-in-progress: false # A run in flight finishes; the next waits.

jobs:
  shadow:
    if: github.repository == 'FHFHockey-dev/fhfhockey.com' && vars.X_TWSCRAPE_SHADOW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout the fallback only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: tools/x-twscrape-fallback
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.17"
          cache: pip
          cache-dependency-path: tools/x-twscrape-fallback/requirements.txt

      - name: Install twscrape
        run: python -m pip install --disable-pip-version-check --quiet -r tools/x-twscrape-fallback/requirements.txt

      - name: Unit tests
        working-directory: tools/x-twscrape-fallback
        run: python -m unittest --quiet test_fallback

      - name: Read X and post to x-timeline-ingest (shadow)
        working-directory: tools/x-twscrape-fallback
        env:
          X_FALLBACK_MODE: shadow
          X_INGEST_URL: https://fyhftlxokyjtpndbkfse.supabase.co/functions/v1/x-timeline-ingest
          X_INGEST_SECRET: ${{ secrets.X_INGEST_SECRET }}
          X_BURNER_COOKIES: ${{ secrets.X_BURNER_COOKIES }}
          X_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TWS_TELEMETRY: "0"
        run: python fallback.py
